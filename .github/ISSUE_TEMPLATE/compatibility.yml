name: Compatibility report
description: You tried VibeSPICE on a system, app or model. Tell us how it went, even if it worked.
title: "Tried with: "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Each version's entry in the [changelog](https://github.com/mauro-hw/vibespice/blob/main/CHANGELOG.md)
        says what it has been tried with. Your report goes there in the next release.
        **Never paste your API key or your `config.toml`.**
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - It worked
        - It worked, with some problems
        - It did not work
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version
      description: The output of `vibespice --version`.
      render: text
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Operating system and version (and WSL, if you used it), Python and ngspice versions.
      placeholder: macOS 26 on Apple silicon, Python 3.13, ngspice 45 from Homebrew
    validations:
      required: true
  - type: checkboxes
    id: tried
    attributes:
      label: What you tried
      options:
        - label: Installing it and `vibespice selftest`
        - label: "`vibespice init` and `vibespice check`"
        - label: "`vibespice run`"
        - label: "`vibespice bench`"
        - label: "`vibespice mcp`, from a chat app"
  - type: input
    id: model
    attributes:
      label: Model or app
      description: The provider and model, or the chat app and its model.
      placeholder: openai with OpenRouter, qwen/qwen3-coder · or · Codex with GPT-5
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: >-
        Anything worth knowing: steps that were not obvious, what failed and its output,
        benchmark results if you ran it.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before sending
      options:
        - label: I have removed API keys and anything private from what I pasted.
          required: true
