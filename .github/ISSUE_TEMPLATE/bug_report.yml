name: Bug report
description: Something does not work as the README says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. **Never paste your API key or your `config.toml`.**
        A security problem (a netlist that gets past the safety limits, a key that leaks)
        goes through [SECURITY.md](https://github.com/mauro-hw/vibespice/blob/main/SECURITY.md),
        not here.
  - type: textarea
    id: version
    attributes:
      label: Version
      description: The output of `vibespice --version`.
      render: text
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Operating system and version, and the ngspice version (`ngspice --version`).
      placeholder: Fedora 44, ngspice 47
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: What were you doing?
      options:
        - Installing it
        - vibespice init or check
        - vibespice run
        - vibespice bench
        - vibespice mcp, from a chat app
        - vibespice selftest or analyze
        - Something else
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: The provider and model, or the chat app if you use `vibespice mcp`.
      placeholder: anthropic, claude-opus-5-5 · or · Claude Desktop on Windows
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The exact command, what you expected and what you saw.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        The relevant part of the terminal output or of the log. Read it first: a log holds
        your whole task and the model's replies.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before sending
      options:
        - label: I have removed API keys and anything private from what I pasted.
          required: true
